[Unit]
After=sys-kernel-config.mount

[Service]
Environment=ADBD_GADGET_UDC=fc000000.usb
Environment=ENV=/etc/tspi-adb-shellrc
ExecStartPre=
ExecStartPre=/usr/local/sbin/tspi-adb-gadget setup
ExecStartPost=
ExecStartPost=/usr/local/sbin/tspi-adb-gadget activate
ExecStopPost=
ExecStopPost=/usr/local/sbin/tspi-adb-gadget reset
Restart=on-failure
RestartSec=3
TimeoutStartSec=45
TimeoutStopSec=15
